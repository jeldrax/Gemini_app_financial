name: gemini_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2
  
dependencies:
  flutter:
    sdk: flutter
    #go_router: ^8.0.0 Sirve para navegar entre pantallas mediante url(links), ya que en flutter tienes que navegar como en cebolla, por capaz
  go_router: ^18.1.3
    #image_picker: ^1.2.4 Sirve para seleccionar imagenes de la galeria o tomar fotos con la camara del dispositivo
  image_picker: ^1.2.4
    #flutter_chat_ui: ^2.12.0 sirve para crear interfaces de chat en flutter, con burbujas de mensajes, listas de mensajes, etc.
  flutter_chat_ui: ^2.12.0
    #uuid: ^4.6.0 uuid es un paquete de Dart que genera identificadores únicos? dentro de tus aplicaciones.
  uuid: ^4.6.0
  #dio es un cliente HTTP avanzado para Dart y Flutter diseñado para gestionar todas las conexiones entre tu aplicación y los servidores o APIs REST.
  dio: ^5.11.1
  material_ui: ^1.10.0
  hooks_riverpod: ^3.5.0
  flutter_hooks: ^0.21.4
  riverpod_annotation: ^4.0.8
  flutter_riverpod: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.10
  build_runner: ^2.17.1
  riverpod_lint: ^3.2.0

flutter:
  uses-material-design: true
